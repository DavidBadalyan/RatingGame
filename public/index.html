<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Hear Me Out</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400;12..96,700;12..96,800&display=swap">
<style>
:root{--bg:#1b1026;--card:#2b1a3e;--line:#4a3263;--ink:#fff3ea;--mute:#b9a6cc;--pink:#ff5c93;--sun:#ffd84d;--ok:#3be0a3}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%}
body{background:var(--bg);color:var(--ink);font:16px/1.45 "Bricolage Grotesque",system-ui,sans-serif;padding:20px 16px 48px}
main{max-width:520px;margin:0 auto}
h1{font-size:clamp(44px,13vw,68px);line-height:.95;margin:8px 0 6px;font-weight:800;letter-spacing:-.03em}
h1 span{display:inline-block;background:var(--pink);color:#fff;padding:0 .12em;transform:rotate(-3deg);border-radius:.12em}
h2{font-size:26px;margin:0 0 12px;letter-spacing:-.02em}
p.sub{color:var(--mute);margin:0 0 22px}
.screen{display:none}.screen.on{display:block}
.card{background:var(--card);border:2px solid var(--line);border-radius:18px;padding:16px;margin-bottom:14px}
label{display:block;font-weight:700;margin-bottom:6px}
input[type=text],textarea{width:100%;background:#150b1f;color:var(--ink);border:2px solid var(--line);border-radius:12px;padding:12px 14px;font:inherit}
input:focus,textarea:focus,button:focus-visible{outline:3px solid var(--sun);outline-offset:2px}
textarea{resize:none;height:76px}
button{font:inherit;font-weight:800;border:0;border-radius:14px;padding:14px 18px;cursor:pointer;background:var(--pink);color:#fff;width:100%;font-size:17px}
button.alt{background:transparent;color:var(--ink);border:2px solid var(--line)}
button.sun{background:var(--sun);color:#2a1700}
button:disabled{opacity:.4;cursor:not-allowed}
.row{display:flex;gap:10px}.row>*{flex:1}
.gap{height:10px}
#code{text-transform:uppercase;letter-spacing:.3em;text-align:center;font-weight:800}
.roomcode{font-size:56px;font-weight:800;letter-spacing:.14em;text-align:center;color:var(--sun);line-height:1;margin:4px 0 2px}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{padding:6px 12px;border-radius:99px;background:#150b1f;border:2px solid var(--line);font-weight:700;font-size:14px}
.chip.ready{border-color:var(--ok);color:var(--ok)}.chip.off{opacity:.4}
.chip.host::after{content:" 👑"}
.err{color:#ff8fa8;min-height:1.4em;margin:8px 0 0;font-weight:700}
.set{display:flex;align-items:center;justify-content:space-between;gap:12px;margin:10px 0}
.set b{font-weight:700}
.stepper{display:flex;align-items:center;gap:10px}
.stepper button{width:40px;height:40px;padding:0;font-size:22px;background:#150b1f;border:2px solid var(--line)}
.stepper span{min-width:44px;text-align:center;font-weight:800;font-size:20px}
.pick{display:block;border:3px dashed var(--line);border-radius:16px;text-align:center;padding:0;cursor:pointer;overflow:hidden;background:#150b1f}
.pick .ph{padding:42px 10px;color:var(--mute);font-weight:700}
.pick img{display:block;width:100%;max-height:340px;object-fit:cover}
.pick input{display:none}
.polaroid{background:#fffaf4;padding:12px 12px 14px;border-radius:6px;transform:rotate(-1.2deg);box-shadow:0 14px 30px #0008;margin:6px 4px 18px;color:#2a1700}
.polaroid img{width:100%;max-height:52vh;object-fit:contain;background:#eadfd3;display:block;border-radius:2px}
.polaroid .cap{font-weight:700;font-size:18px;margin-top:10px;word-break:break-word}
.polaroid .by{color:#7d6a58;font-size:14px;font-weight:700}
.meta{display:flex;justify-content:space-between;color:var(--mute);font-weight:700;margin-bottom:8px}
.bar{height:8px;background:#150b1f;border-radius:9px;overflow:hidden;margin-bottom:10px}
.bar i{display:block;height:100%;width:100%;background:var(--sun);transform-origin:left;transition:transform .25s linear}
.nums{display:grid;grid-template-columns:repeat(5,1fr);gap:8px}
.nums button{padding:16px 0;font-size:22px;background:#150b1f;border:2px solid var(--line)}
.nums button.sel{background:var(--sun);color:#2a1700;border-color:var(--sun)}
.note{text-align:center;color:var(--mute);font-weight:700;padding:10px}
.podium{display:flex;align-items:flex-end;justify-content:center;gap:8px;margin:10px 0 20px;min-height:220px}
.pod{flex:1;text-align:center;max-width:150px}
.pod .nm{font-weight:800;word-break:break-word;margin-bottom:4px}
.pod .sc{color:var(--sun);font-weight:800;font-size:22px}
.pod .blk{border-radius:12px 12px 0 0;margin-top:6px;display:flex;align-items:flex-start;justify-content:center;padding-top:8px;font-size:30px;font-weight:800;color:#2a1700}
.p1 .blk{height:130px;background:var(--sun)}.p2 .blk{height:94px;background:#d6d3e6}.p3 .blk{height:70px;background:#e8a26b}
.board{display:flex;justify-content:space-between;padding:10px 4px;border-bottom:1px solid var(--line);font-weight:700}
.board:last-child{border:0}.board em{font-style:normal;color:var(--sun)}
#toast{position:fixed;left:50%;bottom:22px;transform:translateX(-50%);background:var(--ink);color:#2a1700;padding:10px 16px;border-radius:12px;font-weight:800;display:none;z-index:9}
@media (prefers-reduced-motion:reduce){.bar i{transition:none}}
</style>
</head>
<body>
<main>

<section class="screen on" id="s-home">
  <h1>Hear me <span>out</span></h1>
  <p class="sub">Upload your wildest crush, defend it, and find out who has the best taste.</p>
  <div class="card">
    <label for="name">Display name</label>
    <input type="text" id="name" maxlength="20" autocomplete="off" placeholder="What should we call you?">
    <div class="gap"></div>
    <button id="host">Host game</button>
    <div class="gap"></div>
    <div class="row">
      <input type="text" id="code" maxlength="4" autocomplete="off" placeholder="CODE" aria-label="Room code">
      <button class="alt" id="join">Join game</button>
    </div>
    <p class="err" id="homeErr"></p>
  </div>
</section>

<section class="screen" id="s-lobby">
  <h2>Room code</h2>
  <div class="card">
    <div class="roomcode" id="lCode"></div>
    <p class="note" style="padding:0">Friends enter this code to join.</p>
  </div>
  <div class="card"><label>Players</label><div class="chips" id="lPlayers"></div></div>
  <div class="card" id="lSettings">
    <label>Game settings</label>
    <div class="set"><b>Rounds</b><div class="stepper"><button data-s="rounds" data-d="-1" aria-label="Fewer rounds">−</button><span id="vRounds"></span><button data-s="rounds" data-d="1" aria-label="More rounds">+</button></div></div>
    <div class="set"><b>Seconds to rate each pic</b><div class="stepper"><button data-s="rateSecs" data-d="-5" aria-label="Less time">−</button><span id="vSecs"></span><button data-s="rateSecs" data-d="5" aria-label="More time">+</button></div></div>
  </div>
  <button id="start">Start game</button>
  <p class="note" id="lWait"></p>
  <div class="gap"></div>
  <button class="alt leave">Leave room</button>
</section>

<section class="screen" id="s-submit">
  <div class="meta"><span id="sRound"></span><span id="sCount"></span></div>
  <h2>Pick your hear-me-out</h2>
  <label class="pick" id="pick"><div class="ph" id="pickPh">Tap to upload a picture</div><img id="pickImg" alt="" hidden><input type="file" id="file" accept="image/*"></label>
  <div class="gap"></div>
  <label for="desc">Defend your pick (optional)</label>
  <textarea id="desc" maxlength="200" placeholder="Why do they deserve a 10?"></textarea>
  <div class="gap"></div>
  <button id="ready">Ready</button>
  <p class="note" id="sNote"></p>
  <div class="card"><div class="chips" id="sPlayers"></div></div>
</section>

<section class="screen" id="s-rate">
  <div class="meta"><span id="rWhich"></span><span id="rTime"></span></div>
  <div class="bar"><i id="rBar"></i></div>
  <div class="polaroid"><img id="rImg" alt="Hear me out pick"><div class="cap" id="rCap"></div><div class="by" id="rBy"></div></div>
  <div id="rVote">
    <div class="nums" id="nums"></div>
    <div class="gap"></div>
    <button id="lock" disabled>Lock in rating</button>
  </div>
  <p class="note" id="rNote"></p>
  <div class="card"><div class="chips" id="rPlayers"></div></div>
</section>

<section class="screen" id="s-final">
  <h2>Who has the best taste?</h2>
  <div class="podium" id="podium"></div>
  <div class="card" id="board"></div>
  <button id="again">Play again</button>
  <p class="note" id="fNote"></p>
  <div class="gap"></div>
  <button class="alt leave">Leave room</button>
</section>

</main>
<div id="toast" role="status"></div>

<script src="/socket.io/socket.io.js"></script>
<script>
const $=id=>document.getElementById(id);
const socket=io();
let S=null,item=null,sel=0,pending=null,localImg=null,lastKey='',tick=null,itemEnd=0;
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const save=(pid,code)=>localStorage.setItem('hmo',JSON.stringify({pid,code}));
const clear=()=>localStorage.removeItem('hmo');
function toast(m){const t=$('toast');t.textContent=m;t.style.display='block';clearTimeout(t._t);t._t=setTimeout(()=>t.style.display='none',2600)}
function show(id){document.querySelectorAll('.screen').forEach(s=>s.classList.toggle('on',s.id==='s-'+id))}
function goHome(msg){S=null;item=null;localImg=null;lastKey='';clear();show('home');$('homeErr').textContent=msg||''}

$('name').value=localStorage.getItem('hmoName')||'';
const nm=()=>{const v=$('name').value.trim();localStorage.setItem('hmoName',v);return v};
$('host').onclick=()=>socket.emit('host',{name:nm()},res=>{if(res.err)$('homeErr').textContent=res.err;else save(res.pid,res.code)});
$('join').onclick=()=>socket.emit('join',{name:nm(),code:$('code').value},res=>{if(res.err)$('homeErr').textContent=res.err;else save(res.pid,res.code)});
$('code').oninput=e=>e.target.value=e.target.value.toUpperCase();
document.querySelectorAll('.leave').forEach(b=>b.onclick=()=>{socket.emit('leave');goHome()});

socket.on('connect',()=>{
  const r=JSON.parse(localStorage.getItem('hmo')||'null');
  if(r)socket.emit('rejoin',r,res=>{if(res.err)goHome()});
});
socket.on('toast',toast);
socket.on('closed',m=>goHome(m));
socket.on('item',it=>{item=it;itemEnd=Date.now()+it.ms;sel=0;pending=null;if(S)renderRate()});
socket.on('state',s=>{S=s;render()});

function chips(el,withReady){
  $(el).innerHTML=S.players.map(p=>`<span class="chip ${withReady&&p.ready?'ready':''} ${p.online?'':'off'} ${p.id===S.hostId?'host':''}">${esc(p.name)}${p.id===S.me?' (you)':''}</span>`).join('');
}
function render(){
  const amHost=S.me===S.hostId;
  if(S.phase==='lobby'){
    show('lobby');localImg=null;lastKey='';
    $('lCode').textContent=S.code;chips('lPlayers',false);
    $('vRounds').textContent=S.settings.rounds;$('vSecs').textContent=S.settings.rateSecs;
    document.querySelectorAll('#lSettings button').forEach(b=>b.disabled=!amHost);
    $('start').style.display=amHost?'block':'none';
    $('start').disabled=S.players.filter(p=>p.online).length<2;
    $('lWait').textContent=amHost?(S.players.length<2?'Waiting for at least one more player.':''):'Waiting for the host to start.';
  }else if(S.phase==='submit'){
    show('submit');
    const key='r'+S.round;
    if(key!==lastKey){lastKey=key;localImg=S.mine.img||null;$('desc').value=S.mine.desc||'';setPick()}
    $('sRound').textContent=`Round ${S.round} of ${S.settings.rounds}`;
    const done=S.players.filter(p=>p.ready).length;$('sCount').textContent=`${done}/${S.players.length} ready`;
    $('ready').textContent=S.mine.ready?'Edit my pick':'Ready';
    $('ready').className=S.mine.ready?'alt':'';
    $('file').disabled=S.mine.ready;$('desc').disabled=S.mine.ready;
    $('sNote').textContent=S.mine.ready?'Locked in. Waiting for everyone else.':'';
    chips('sPlayers',true);
  }else if(S.phase==='rate'){
    show('rate');renderRate();
  }else if(S.phase==='final'){
    show('final');renderFinal();
  }
}
function setPick(){
  $('pickImg').hidden=!localImg;if(localImg)$('pickImg').src=localImg;
  $('pickPh').style.display=localImg?'none':'block';
}
$('file').onchange=async e=>{
  const f=e.target.files[0];if(!f)return;
  try{
    const bmp=await createImageBitmap(f);
    const k=Math.min(1,720/Math.max(bmp.width,bmp.height));
    const c=document.createElement('canvas');c.width=Math.round(bmp.width*k);c.height=Math.round(bmp.height*k);
    c.getContext('2d').drawImage(bmp,0,0,c.width,c.height);
    localImg=c.toDataURL('image/jpeg',.82);setPick();
  }catch{toast('Could not read that image. Try another one.')}
};
$('ready').onclick=()=>{
  if(S.mine.ready)return socket.emit('unready');
  if(!localImg)return toast('Upload a picture first.');
  socket.emit('ready',{img:localImg,desc:$('desc').value});
};

const nums=$('nums');
nums.innerHTML=Array.from({length:10},(_,i)=>`<button data-v="${i+1}">${i+1}</button>`).join('');
nums.onclick=e=>{const b=e.target.closest('button');if(!b||S.myRating!==null)return;sel=+b.dataset.v;paintNums()};
function paintNums(){
  const v=S&&S.myRating!==null?S.myRating:sel;
  nums.querySelectorAll('button').forEach(b=>{b.classList.toggle('sel',+b.dataset.v===v);b.disabled=S&&S.myRating!==null});
  $('lock').disabled=!sel||S.myRating!==null;
  $('lock').textContent=S.myRating!==null?'Rating locked in':'Lock in rating';
}
$('lock').onclick=()=>{if(sel)socket.emit('rate',sel)};
function renderRate(){
  if(!item||item.idx!==S.idx)return;
  const mine=item.ownerId===S.me;
  $('rWhich').textContent=`Round ${S.round}/${S.settings.rounds} · pic ${item.idx+1} of ${item.total}`;
  $('rImg').src=item.img;$('rCap').textContent=item.desc||'';
  $('rBy').textContent=`Hear-me-out by ${item.ownerName}`;
  $('rVote').style.display=mine?'none':'block';
  $('rNote').textContent=mine?'This one is yours. Sit tight while everyone rates it.':(S.myRating!==null?'Waiting for the others.':'');
  paintNums();chips('rPlayers',true);
  clearInterval(tick);
  const total=S.settings.rateSecs*1000;
  const upd=()=>{
    const left=Math.max(0,itemEnd-Date.now());
    $('rTime').textContent=Math.ceil(left/1000)+'s';
    $('rBar').style.transform=`scaleX(${Math.min(1,left/total)})`;
  };upd();tick=setInterval(upd,200);
}
function renderFinal(){
  clearInterval(tick);
  const f=S.final,top=[f[1],f[0],f[2]],cls=['p2','p1','p3'],pl=['2','1','3'];
  $('podium').innerHTML=top.map((p,i)=>p?`<div class="pod ${cls[i]}"><div class="nm">${esc(p.name)}</div><div class="sc">${p.score}</div><div class="blk">${pl[i]}</div></div>`:'').join('');
  $('board').innerHTML=f.map((p,i)=>`<div class="board"><span>${i+1}. ${esc(p.name)}${p.id===S.me?' (you)':''}</span><em>${p.score} / 100</em></div>`).join('');
  const amHost=S.me===S.hostId;
  $('again').style.display=amHost&&!S.hostGone?'block':'none';
  $('fNote').textContent=amHost?'':(S.hostGone?'The host left, so this room can’t start another game.':'Waiting for the host to start another game.');
}
document.querySelectorAll('#lSettings button').forEach(b=>b.onclick=()=>{
  const k=b.dataset.s,s={...S.settings};s[k]+=+b.dataset.d;socket.emit('settings',s);
});
$('start').onclick=()=>socket.emit('start');
$('again').onclick=()=>socket.emit('again');
</script>
</body>
</html>
